<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tripwire</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  h1 { font-size: 1.3em; margin: 0 0 4px; }
  h2 { font-size: 1.05em; margin: 20px 0 6px; }
  p { margin: 4px 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #bbb; padding: 3px 8px; text-align: left; }
  th { background: #eee; }
  .alert { color: #b00020; font-weight: bold; }
  .none { color: #555; }
  button { margin: 8px 0; }
</style>
</head>
<body>
<h1>tripwire</h1>
<p id="info"></p>
<button id="check" type="button">Check now</button>

<h2>Decoys</h2>
<table>
  <thead><tr><th>Path</th><th>Kind</th><th>Status</th><th>Last access</th></tr></thead>
  <tbody id="decoys"></tbody>
</table>

<h2>Alerts</h2>
<table>
  <thead><tr><th>Time</th><th>Decoy</th><th>Process guess</th></tr></thead>
  <tbody id="alerts"></tbody>
</table>
<script>
const fmt = (iso) => (iso ? new Date(iso).toLocaleString() : '-');

function fill(id, rows, cols, empty) {
  const body = document.getElementById(id);
  body.textContent = '';
  if (!rows.length) {
    const td = document.createElement('td');
    td.colSpan = cols;
    td.className = 'none';
    td.textContent = empty;
    body.appendChild(document.createElement('tr')).appendChild(td);
    return;
  }
  for (const cells of rows) {
    const tr = body.appendChild(document.createElement('tr'));
    for (const c of cells) {
      const td = tr.appendChild(document.createElement('td'));
      td.textContent = c.text ?? c;
      if (c.cls) td.className = c.cls;
    }
  }
}

function apply(st) {
  fill('decoys', st.decoys.map((d) => [
    d.dir + '\\' + d.name,
    d.kind,
    d.state === 'missing' ? { text: 'missing', cls: 'alert' } : d.alerts ? { text: 'alerted (' + d.alerts + ')', cls: 'alert' } : 'ok',
    fmt(d.last_alert),
  ]), 4, 'No decoys planted.');
  fill('alerts', st.alerts.map((a) => [fmt(a.ts), a.name + ' (' + a.source + ')', a.process || '-']), 3, 'No alerts.');
  const i = st.info || {};
  document.getElementById('info').textContent = st.decoys.length + ' decoys, ' + st.alerts.length + ' alerts' +
    (i.interval ? ', polling every ' + i.interval + 's' : '') + ', webhook ' + (i.webhook ? 'on' : 'off') + ', 4663 audit ' + (i.audit ? 'on' : 'off');
}

async function load(method) {
  try {
    const r = await fetch(method === 'POST' ? '/api/check' : '/api/state', { method: method || 'GET' });
    if (r.ok) apply(await r.json());
  } catch (e) { /* server gone; keep the last table */ }
}
document.getElementById('check').addEventListener('click', () => load('POST'));
load();
setInterval(load, 3000);
</script>
</body>
</html>

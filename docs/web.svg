<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 738" width="760"><style>
  
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 Georgia, "Times New Roman", serif; }
  main { max-width: 860px; margin: 0 auto; padding: 22px 18px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; font-weight: normal; letter-spacing: .04em; font-style: italic; }
  .sub, .mono { font: 12px/1.4 Consolas, "Courier New", monospace; color: var(--thread); }
  button { font: 12px Consolas, monospace; background: none; color: var(--ink); border: 1px solid var(--thread); padding: 3px 10px; cursor: pointer; }
  button:hover { background: var(--ink); color: var(--paper); }
  svg { width: 100%; height: auto; display: block; margin-top: 6px; }
  .strand { fill: none; stroke: var(--thread); stroke-width: .8; stroke-linecap: round; }
  .ring { stroke-width: .55; opacity: .85; }
  .node circle { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
  .node text.g { font: 6.5px Consolas, monospace; text-anchor: middle; fill: var(--ink); }
  .node text.l { font: 9px Consolas, monospace; text-anchor: middle; fill: var(--thread); stroke: var(--paper); stroke-width: 3px; paint-order: stroke; }
  .node.missing circle { stroke-dasharray: 2 2; stroke: var(--faint); }
  .node.disturbed circle { fill: var(--rust); stroke: var(--rust); }
  .node.disturbed text.g { fill: var(--paper); }
  .node.disturbed text.l { fill: var(--rust); }
  .node.disturbed .halo { display: block; }
  .halo { display: none; fill: none; stroke: var(--rust); stroke-width: .8; animation: halo 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes halo { from { transform: scale(1); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }
  .spider { fill: var(--ink); stroke: var(--ink); stroke-width: .8; }
  h2 { font-size: 13px; font-weight: normal; letter-spacing: .12em; text-transform: uppercase; color: var(--thread); margin: 26px 0 8px; }
  ol { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 1px solid var(--thread); }
  li { position: relative; padding: 5px 0 7px 12px; }
  li::before { content: ""; position: absolute; left: -22px; top: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--paper); border: 1px solid var(--ink); }
  li.new::before { background: var(--rust); border-color: var(--rust); }
  li .what { font-style: italic; }
  li .src { color: var(--rust); }
  .empty { color: var(--thread); font-style: italic; padding-left: 18px; }
